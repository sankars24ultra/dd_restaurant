<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Order</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/order.js" defer></script>
</head>
<body>
    <h2>Place Order</h2>

    <div>
        <button type="button" onclick="openOrderPopup()">Place Order</button>
    </div>

    <div id="menuTiles" class="tiles-grid" aria-live="polite"></div>

    <!-- Order Popup -->
    <div id="orderPopup" class="popup" role="dialog" aria-hidden="true">
        <h3>Create Order</h3>

        <div class="row">
            <label>Order Name</label>
            <input id="orderName" type="text" placeholder="Customer or order name" value="Customer">
        </div>

        <div>
            <label>Order Menus</label>
            <table id="orderMenusTable">
                <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="row two">
            <div>
                <label>Total</label>
                <input id="orderTotal" class="readonly" type="text" readonly>
            </div>
            <div>
                <label>Date/Time</label>
                <input id="orderDateTime" class="readonly" type="text" readonly>
            </div>
        </div>

        <fieldset class="payment">
            <legend>Payment</legend>
            <div class="row">
                <label>Cash</label>
                <input id="payCash" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="row">
                <label>GPay</label>
                <input id="payGpay" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="row">
                <label>Remaining</label>
                <input id="payRemaining" class="readonly" type="text" readonly>
            </div>
            <div class="row">
                <label>Pending</label>
                <input id="payPending" class="readonly" type="text" readonly>
            </div>
        </fieldset>

        <div class="actions">
            <button type="button" id="confirmOrderBtn">Confirm Order</button>
            <button type="button" onclick="closeOrderPopup()">Cancel</button>
        </div>
    </div>
</body>
</html>
