            <!-- Delete confirmation popup for menu -->
            <div id="menu-delete-confirm-popup" class="popup" style="display:none;min-width:320px;max-width:90vw;z-index:2200;border-radius:12px;">
                <h3><span>&#9888;&#65039;</span> Delete Menu Item</h3>
                <div id="menu-delete-confirm-details"></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                    <button id="menuConfirmDeleteBtn" style="background:#cc0000;color:#fff;">Delete</button>
                    <button id="menuCancelDeleteBtn">Cancel</button>
                </div>
            </div>
        <!-- Edit Menu Item Popup -->
        <div id="editMenuPopup" class="popup edit-menu-popup" style="display:none;z-index:2100;min-width:320px;">
            <h3>Edit Menu Item</h3>
            <div class="edit-field">
                <label for="editMenuName">Name:</label>
                <input type="text" id="editMenuName">
            </div>
            <div class="edit-field">
                <label for="editMenuPrice">Price:</label>
                <input type="number" id="editMenuPrice">
            </div>
            <div class="edit-field">
                <label for="editMenuImage">Image:</label>
                <select id="editMenuImage">
                    <option value="default.png">default.png</option>
                    <option value="dosa.png">dosa.png</option>
                    <option value="idly.png">idly.png</option>
                </select>
            </div>
            <div class="edit-popup-actions">
                <button id="editMenuCancel" class="edit-cancel">Cancel</button>
                <button id="editMenuUpdate" class="edit-update" disabled>Update</button>

        </div>
    <!-- Price Update Confirmation Modal -->
    <div id="priceConfirmModal" class="popup" style="display:none;z-index:2000;">

        <div id="priceConfirmText" style="margin-bottom:16px;"></div>
        <div style="display:flex;gap:12px;justify-content:flex-end;">

            <button id="priceConfirmOk" style="background:#28a745;">Update</button>
        </div>
    </div>
