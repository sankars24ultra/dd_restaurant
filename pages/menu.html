<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/menu.js" defer></script>
</head>
<body>
    <h2>Menu</h2>
    <button onclick="openMenuPopup()">Add Menu</button>

    <!-- Menu Table -->
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Image</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="menuTableBody">
            <!-- Menu items will be injected here by JS -->
        </tbody>
    </table>

    <!-- Add Menu Popup -->
    <!-- menu.html -->
    <div id="addMenuPopup" class="popup">
        <h3>Add Menu Item</h3>
        <label>Name:</label>
        <input type="text" id="menuName"><br>
        <label>Price:</label>
        <input type="number" id="menuPrice"><br>
        <label>Image:</label>
        <input type="file" id="menuImage"><br>
        <button type="button" onclick="openMenuPopup()">Add Menu</button>
        <button onclick="closeMenuPopup()">Cancel</button>
    </div>

<script src="/js/menu.js"></script>

</body>
</html>
