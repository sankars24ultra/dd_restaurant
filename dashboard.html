<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h2 class="logo">DD Family Restaurant</h2>
            <ul class="menu-list">
                <li><a href="pages/home.html" class="menu-link active">Home</a></li>
                <li><a href="pages/menu.html" class="menu-link">Menu</a></li>
                <li><a href="pages/order.html" class="menu-link">Order</a></li>
                <li><a href="pages/orderHistory.html" class="menu-link">Order History</a></li>
                <li><a href="pages/expenses.html" class="menu-link">Expenses</a></li>
                <li><a href="pages/summary.html" class="menu-link">Summary</a></li>
                <li><a href="pages/icons.html" class="menu-link">Icons</a></li>
                <li><button id="logout-btn" style="width:100%;margin-top:20px;padding:10px;background:#dc3545;color:#fff;border:none;border-radius:5px;cursor:pointer;">Logout</button></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content" id="content-frame">
            <iframe src="pages/home.html" id="page-frame" frameborder="0"></iframe>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script>
    document.getElementById('logout-btn').onclick = async function() {
        try {
            await fetch('/logout', { method: 'POST' });
        } catch (e) {}
        window.location.href = 'index.html?logged_out=1';
    };
    </script>
</body>
</html>
